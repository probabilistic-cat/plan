services:
    db:
        image: postgres:${POSTGRES_VERSION}-trixie
        environment:
            POSTGRES_USER: ${DB_ROOT_USER}
            POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
            DB_NAME: ${DB_NAME}
            DB_OWNER: ${DB_OWNER}
            DB_USER_MIGRATION: ${DB_USER_MIGRATION}
            DB_USER_MIGRATION_PASSWORD: ${DB_USER_MIGRATION_PASSWORD}
            DB_USER_APP: ${DB_USER_APP}
            DB_USER_APP_PASSWORD: ${DB_USER_APP_PASSWORD}
            DB_SCHEMA: ${DB_SCHEMA}
        volumes:
            - db-data:/var/lib/postgresql
            - ./config/postgres/init/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
            - ./config/postgres/sql:/docker-entrypoint-initdb.d/sql:ro
        ports:
            - ${DB_PORT_EXPOSED}:5432
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${DB_NAME}\""]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 5s

    app:
        build:
            context: ..
            dockerfile: docker/Dockerfile
        environment:
            DATABASE_URL: "postgresql://${DB_USER_APP}:${DB_USER_APP_PASSWORD}@db:5432/${DB_NAME}?serverVersion=${POSTGRES_VERSION}&charset=utf8&options=-csearch_path%3D${DB_SCHEMA}"
        depends_on:
            db:
                condition: service_healthy

    webserver:
        image: nginx:${NGINX_VERSION}-trixie
        environment:
            SERVER_NAME: ${SERVER_NAME}
        ports:
            - ${SERVER_PORT}:80
        volumes:
            - ./config/nginx/default.conf.template:/etc/nginx/templates/default.conf.template
        depends_on:
            - app

volumes:
    db-data:
