todo_homepage:
    path: /
    defaults:
        _controller: App\Controller\MainController::indexAction

todo_admin:
    path: /admin/
    defaults:
        _controller: App\Controller\MainController::adminAction

todo_login:
    path: /login/
    defaults:
        _controller: App\Controller\SignController::loginAction

todo_logout:
    path: /logout

todo_signup:
    path: /signup
    defaults:
        _controller: App\Controller\SignController::signupAction
